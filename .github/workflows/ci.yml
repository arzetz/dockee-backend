name: CI - dockee-backend

on:
  push:
    branches: [dev, 'feature/**']
  pull_request:
    branches: [main, dev]

jobs:
  lint-test-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: Create minimal Go module
        run: |
          go mod init github.com/dockee/backend
          cat > main.go << 'EOF'
          package main
          import "fmt"
          func main() { fmt.Println("Dockee backend") }
          EOF

      - name: Run go vet
        run: go vet ./...

      - name: Run tests
        run: go test ./... -v

      - name: Build binary
        run: go build -o dockee-backend ./...
